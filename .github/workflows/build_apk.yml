name: Build & Release Android APK (Android 5.0+)

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'চিঠিবক্স Android App Release'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Universal Release APK (Android 5.0+)
        run: flutter build apk --release

      - name: Build Split-per-ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Rename & Organize APK Artifacts
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/chithibox-universal-release.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/chithibox-armeabi-v7a-android5+.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/chithibox-arm64-v8a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/chithibox-x86_64.apk
          fi

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chithi-android-apks
          path: release-apks/*
          retention-days: 30

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="${{ github.event.inputs.release_name || github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_name || github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${VERSION}"
            TITLE="চিঠিবক্স Android App v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/chithibox-universal-release.apk
            release-apks/chithibox-armeabi-v7a-android5+.apk
            release-apks/chithibox-arm64-v8a.apk
            release-apks/chithibox-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
